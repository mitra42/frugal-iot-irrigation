; ==== Frugal-IoT Irrigation V0.1 board ==================================================
; For frugal-iot-irrigation/platformio.ini - paste below the existing envs; uses its [common].
; Copy variants/frugal_irrigation_v01/ into the project's variants/ folder.
; Pin map: DECISIONS.md D18 (ESP32-C6-MINI-1U fitted, the BOM default). C3-MINI-1U differences at the end.
;
; NOT YET BUILDABLE for irrigation: the four relays are driven through a TCA9534 I2C expander
; (address 0x20, P0-P3 = K1-K4, HIGH = relay on), not GPIOs. frugal-iot-irrigation.ino creates
; Actuator_Digital(..., IRRIGATION_VALVE1_PIN) on a GPIO, and the library has no expander actuator
; yet - so this needs a small Actuator_TCA9534 (or a pin-number convention for expander pins) before
; the valves work. The proposed flags are below, commented out.
[env:frugal_irrigation_v01]
platform = ${common.platform_esp32}
board = esp32-c6-devkitc-1                ; generic C6; this board's own pins come from the variant
board_upload.flash_size = 4MB             ; -H4 module is 4 MB (the DevKitC-1 json says 8 MB)
board_upload.maximum_size = 4194304
board_build.variants_dir = variants
board_build.variant = frugal_irrigation_v01   ; LED_BUILTIN=8 plain LED, SDA=7, SCL=14
board_build.partitions = min_spiffs.csv
lib_deps =
    ${common.lib_deps_oled}
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="frugal_irrigation_v01"'
    -D ARDUINO_FRUGAL_IOT_IRRIGATION_V01      ; this board, for code and for scripts/generate_platform_h.py
    -D ARDUINO_USB_MODE=1                     ; native USB on the USB-C: no USB-UART chip
    -D ARDUINO_USB_CDC_ON_BOOT=1              ; Serial = USB
    -D ACTUATOR_LEDBUILTIN_INVERT             ; status LED D8 on GPIO8 is active LOW
    ; --- I2C (sensor terminal J8, OLED header J9, TCA9534) ---
    -D I2C_SDA=7
    -D I2C_SCL=14
    ; --- switched rails: RAIL_EN (GPIO15) HIGH = 3V3_SW and 5V_SW on; 100k pull-down = off at reset.
    ; Must be on before ANY I2C traffic - the bus pull-ups are on 3V3_SW - and before RS485.
    -D SYSTEM_POWER3v3_PIN=15
    ; --- RS485 (J11: 5V_SW, A, B, GND). Direction is switched in hardware from TX, so no DE/RE pin.
    -D SENSOR_SOILMODBUS_WANT
    -D SENSOR_SOILMODBUS_AUTOPROVISION
    -D SYSTEM_RS485_RX_PIN=0
    -D SYSTEM_RS485_TX_PIN=2
    '-D SYSTEM_RS485_UART=Serial1'            ; Serial is USB, Serial0 is the debug UART
    ; --- battery for the LVD interlocks: the 12 V input, V12_SENSE on GPIO1, 560k/100k = x6.6 ---
    -D SENSOR_BATTERY_PIN=1
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=6.6
    -D SYSTEM_POWER_BAD_READING_MV=9000
    ; The LiPo (if fitted) is read on GPIO3, 1M/1M = x2 - the library has one battery input, so
    ; this one is unused until there is a second (e.g. SENSOR_CELL_PIN=3, divider 2).
    ; --- relays: proposed, needs expander support (see top) ---
    ;-D IRRIGATION_RELAY_TCA9534_ADDRESS=0x20
    ;-D IRRIGATION_VALVE1_EXP=0              ; K1
    ;-D IRRIGATION_VALVE2_EXP=1              ; K2
    ;-D IRRIGATION_VALVE3_EXP=2              ; K3
    ;-D IRRIGATION_PUMP_EXP=3                ; K4
    ; --- spare inputs ---
    ;-D SENSOR_TANK_PIN=6                    ; GPIO_A terminal J6 (ADC1_CH6) - e.g. the tank gauge
    ;                                        ; GPIO_B terminal J7 = GPIO22 (digital), BTN2 = GPIO19
    ; --- OLED on header J9 (SSD1306 128x64, powered from 3V3_SW) ---
    -D ACTUATOR_OLED_WANT
    -D ACTUATOR_OLED_IS_SSD1306
    '-D OLED_WIRE=Wire'
    -D OLED_SDA=7
    -D OLED_SCL=14
    -D OLED_RST_X=-1
    -D ACTUATOR_OLED_WIDTH=128
    -D ACTUATOR_OLED_HEIGHT=64
;
; With the ESP32-C3-MINI-1U fitted instead (and R5/R6 fitted, R3/R4 removed - D19):
;   board = esp32-c3-devkitm-1 (4 MB; drop the two board_upload lines), and in the variant and flags:
;   I2C_SDA / OLED_SDA = 10, I2C_SCL / OLED_SCL = 5, SYSTEM_POWER3v3_PIN = 6, UART0 TX/RX = 21/20.
;   No BTN2, GPIO_A or GPIO_B (C6-only pads). The library already inverts the LED for esp32-c3-devkitm-1.
