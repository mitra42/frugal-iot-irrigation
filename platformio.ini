; PlatformIO Project Configuration File - Frugal-IoT OSPIT irrigation node
;
; Five boards for the same application (wiring for the last three in README.md):
;
;   ff_openmppt            the FF-ESP32-OpenMPPT solar charge controller OSPIT itself runs on.
;   s2_mini                a Lolin S2 Mini driving valves straight from GPIOs, through a driver of your own.
;   s2_mini_daughter       a Lolin S2 Mini driving the irrigation daughter board (hardware/irrigation-daughter).
;   frugal_irrigation_v02  the Frugal-IoT Irrigation V0.2 board (hardware/irrigation-layout-oct-2026).
;   sensor_v02_daughter    the Frugal-IoT sensor board V0.2 driving the irrigation daughter board.
;
; s2_mini and s2_mini_daughter target the same ARDUINO_* macro, so in platform.h the first one is the
; Arduino IDE's default for the LOLIN S2 Mini and the other is chosen by defining its own name
; (S2_MINI_DAUGHTER) - see the comment generate_platform_h.py writes there.

[platformio]
; Anything matching *-local.ini is loaded on top of this file, and is never committed. Two of them,
; for two different jobs - see build_flags_secrets below:
;   platformio-local.ini          your own overrides: the local library (see "Building against a
;                                 local library" in CLAUDE.md) and debug flags. Never reaches a
;                                 release build.
;   platformio-secrets-local.ini  the enrolment secret, and which server this build is for.
;                                 scripts/release.zsh --build hands it to the release build.
; A GLOB rather than names, so a fresh clone with neither builds unchanged.
extra_configs = *-local.ini
name: Frugal-IoT Irrigation
description: Solar-powered sequenced soil-moisture irrigation
src_dir = .
; src_dir = . keeps the sketch at the top of the repo, which is what lets the SAME directory build
; in the Arduino IDE: it needs a .ino whose name matches the folder, beside its own .cpp/.h files.
; Arduino ignores every subdirectory except src/, so lib/, data/, scripts/ and .pio/ are invisible
; to it.

[common]
; A developer working on the library at the same time drops a symlink at lib/Frugal-IoT (it is
; gitignored) - PlatformIO searches the project's own lib/ before lib_deps, so the symlink wins
; and edits to the library are picked up with no reinstall.
; Arduino IDE users install Frugal-IoT from the Library Manager instead.
lib_deps =
    Frugal-IoT@^2.0.16
    ; ModbusMaster (the RS485 soil probes) is a declared dependency of Frugal-IoT, so
    ; lib_ldf_mode = chain pulls it in - it does not need listing here.

lib_deps_oled =
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13

; These are flags common to pretty much all frugal-iot projects
; comment or uncomment debug flags based on need
build_flags_frugaliot =
    ;-D CONTROL_IRRIGATION_DEBUG
    ;-D SENSOR_SOILMODBUS_DEBUG
    ;-D SYSTEM_MODBUS_DEBUG
    ;-D SENSOR_ANALOG_DEBUG
    ; On for the sleep-test branch: it is what prints `Sleeping` just before the board goes, which
    ; is the only indication a tester with a serial monitor gets.
    ;-D SYSTEM_POWER_DEBUG
    ;-D SYSTEM_TIME_DEBUG
    ;-D SYSTEM_MQTT_DEBUG
    ;-D SYSTEM_WIFI_DEBUG
    ;-D SYSTEM_CAPTIVE_DEBUG ; Heap, page,size, client disconnect tracing. 
    ;-D SYSTEM_CAPTIVE_MINIMAL ; replace portal with one-line page to tell transfort fault from content.
    ;-D SYSTEM_GROUP_HEAP_DEBUG ; free heap & largest contiguous block check after each module setup/loop
    -D SYSTEM_LITTLEFS_SUPPORTDEPRECATED ; one-shot migration of saved config from /<id>/<leaf> dirs to flat /<id>.<leaf> files
    ;-D SYSTEM_WIFI_DEBUG
    ;-D SYSTEM_MESSAGE_DEBUG
    ; Turn off C++ exceptions - nothing in this example throws. See examples/agri/platformio.ini
    ; for the measurements behind this.
    -fno-exceptions

; Filled in by the *-local.ini files, which are never committed. Empty here, so this file can be
; committed and a checkout without them still builds. Two keys rather than one because a value set
; in a *-local.ini REPLACES the one here rather than adding to it, so each file needs its own:
;   build_flags_secrets - platformio-secrets-local.ini: the enrolment secret, and which server
;                         this build is for. ota_build.py --secrets links it into a release build.
;   build_flags_local   - platformio-local.ini: your own debug flags. Never reaches an OTA build.
build_flags_secrets =
build_flags_local =

; flags that apply only in main (the library can see them, but doesnt need them)
build_flags_main =
    ${common.build_flags_secrets}
    ${common.build_flags_local}

; project specific flags that are needed by the library
build_flags_library =
    '-D SYSTEM_OTA_PREFIX="irrigation"'

; Battery interlock thresholds, in millivolts. Each is a LIMIT with a DEAD BAND: 12100 +/- 200
; means "off below 11.9V, on again above 12.3V". Here rather than in the sketch because they are
; the main thing that differs between installations - battery chemistry, panel size, and how much
; you mind losing each thing. Together they set the ORDER things are given up in as the battery
; falls: USB first, then irrigation, and the router last. See the note in the .ino.
build_flags_lvd =
    -D IRRIGATION_LVD_LOAD_MV=12100
    -D IRRIGATION_LVD_LOAD_HYST_MV=200
    -D IRRIGATION_LVD_USB_MV=13100
    -D IRRIGATION_LVD_USB_HYST_MV=300
    -D IRRIGATION_LVD_IRRIGATION_MV=12600
    -D IRRIGATION_LVD_IRRIGATION_HYST_MV=200
    -D SENSOR_BATTERY_MIN=10000 ; Lead Acid battery (for display and graphing)
    -D SENSOR_BATTERY_MAX=15000 ; Lead Acid battery (for display and graphing)

; Ask the linker for a map file - scripts/size_report.py reads it.
build_flags_map =
    -Wl,-Map=$BUILD_DIR/firmware.map

; AsyncTCP's service task stack, which is HEAP, not static - so it does not show up in the RAM
; figure at the end of a build, and that is why it went unnoticed.
;
; The library defaults it to 8192*2, sixteen kilobytes, which is the same size as one of mbedTLS's
; two TLS record buffers. The captive portal's handlers are a form POST, a status page and a couple
; of redirects - nothing that needs half of that. On an S2, where TinyUSB has already taken 23KB
; of internal RAM, those sixteen kilobytes are the difference between a TLS handshake that fits and
; one that returns "SSL - Memory allocation failed".
;
; A plain -D works because AsyncTCP.h declares it with #ifndef. Nothing needs rebuilding: this is
; not an sdkconfig setting.
;
; 8192 moved an S2 from "cannot allocate the record buffers" to "failed during chain verification" -
; further in, still short. 4096 is the next step and is still generous for handlers that parse a
; small form and print a status page. Raise it again if a portal handler ever does real work.
build_flags_async =
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096

build_flags =
    ${common.build_flags_frugaliot}
    ${common.build_flags_main}
    ${common.build_flags_library}
    ${common.build_flags_lvd}
    ${common.build_flags_map}
    ${common.build_flags_async}

platform_esp32 = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

[env]
; src_dir = . means "the project's sources are at the top of the repo", which is what makes the
; same directory open in the Arduino IDE. But it also means PlatformIO would compile EVERY .cpp
; below here as project source - including, through the lib/Frugal-IoT symlink, the library's own
; examples and their downloaded dependencies. So say explicitly what is ours.
; Arduino IDE needs no equivalent: it ignores every subdirectory except src/.
; ota-stage/ is where scripts/release.zsh --build stages its builds, each a tree of symlinks back to
; these same sources - so without excluding it, every file would be compiled twice.
build_src_filter = +<*> -<lib/> -<data/> -<scripts/> -<.pio/> -<docs/> -<ota-stage/>
monitor_speed = 460800 ; If not 460800 then also change in main.cpp: frugal_iot.startSerial(newspeed, 5000);
upload_speed = 460800
framework = arduino
board_build.filesystem = littlefs ; Use LittleFS instead of SPIFFS
lib_compat_mode = strict
lib_deps = ${common.lib_deps}
lib_ldf_mode = chain

; ==== FF-ESP32-OpenMPPT =============================================
; The solar charge controller board OSPIT runs on - a plain ESP32. Pin assignments below are
; OSPIT's own, read out of its Lua - see OSPIT_COMPARISON.md for where each comes from.
;
; NOTE the display here is the I2C SSD1306, NOT the SSD1327 SPI panel that examples/all builds for
; this board. The SSD1327 needs dc=16 and rst=17, which are the very UEXT pins the RS485 probes
; use - you get the display or the probes, not both.
[env:ff_openmppt]
platform = ${common.platform_esp32}
board = esp32dev ; defines ARDUINO_ESP32_DEV
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="ff_openmppt"'
    ; --- irrigation hardware ---
    -D IRRIGATION_VALVE1_PIN=26
    -D IRRIGATION_VALVE2_PIN=27
    -D IRRIGATION_VALVE3_PIN=12
    ; Pin 14 can be a pump OR a load switch, not both - see OSPIT_COMPARISON.md. The pump role is
    ; chosen here because it exercises the pump path. To swap, comment out IRRIGATION_PUMP_PIN and
    ; uncomment IRRIGATION_LOAD_PIN.
    -D IRRIGATION_PUMP_PIN=14
    ;-D IRRIGATION_LOAD_PIN=14
    ; A USB supply on pin 12 - the SAME PIN as valve 3, so define one or the other. If you enable
    ; this, remove IRRIGATION_VALVE3_PIN above and drop sector 3 from the sketch.
    ;-D IRRIGATION_USB_PIN=12
    ; The tank gauge. mp2.lua's header comment calls GPIO32 a temperature sense input, but
    ; irrigation.lua reads it as the tank - question 7 in HARDWARE-QUESTIONS.md settles it. If it
    ; turns out to be the temperature input, comment this out and no tank code is compiled.
    -D SENSOR_TANK_PIN=32
    ; --- RS485 soil probes. Slave ids are set in the .ino and start at 2: address 1 is the
    ; factory default and has to stay meaning "not yet provisioned" - see sensor/soilmodbus.h
    -D SENSOR_SOILMODBUS_WANT
    -D SENSOR_SOILMODBUS_AUTOPROVISION
    -D SYSTEM_RS485_RX_PIN=16
    -D SYSTEM_RS485_TX_PIN=17
    '-D SYSTEM_RS485_UART=Serial2'
    ; --- charge controller instrumentation (P5.1 - measurement only, nothing is driven) ---
    ; Solar panel voltage. 1k/27k divider is the 0.035714 ratio in mp2.lua's Vinmeasure(), so 28.
    -D MPPT_PANEL_PIN=34
    -D MPPT_PANEL_DIVIDER=28
    ; The series Schottky D6 drops about 300mV, so the panel is that much higher than the pin says.
    ; SET THIS TO 0 if D6 has been replaced by a wire on your board - question 2 in
    ; HARDWARE-QUESTIONS.md tells the tester how to look.
    -D MPPT_PANEL_DIODE_MV=300
    ; Up to three DS18B20 probes share this pin - air, battery and board temperature. They are told
    ; apart by the id burned into each probe, so which is which survives unplugging them.
    -D MPPT_ONEWIRE_PIN=2
    ; The OTHER way this board can measure its own heat: two diodes read as an analog voltage.
    ; LEFT OFF DELIBERATELY - we believe the DS18B20 above does this job, and turning both on would
    ; give two different answers to the same question. Question 4 in HARDWARE-QUESTIONS.md asks
    ; the tester to look for the diodes; uncomment if they are there and the DS18B20 is not.
    ;-D SENSOR_HEATSINK_PIN=35
    ; --- solar charge control (P5.2 - set by hand, nothing tracks yet) ---
    ; DAC channel 1. Channel 2 is GPIO26, which this board uses as valve 1, so there is only one.
    -D MPPT_DAC_PIN=25
    ; Which panel-voltage range the charge circuit can ask for. With neither of these set nor a
    ; CONTROL_MPPT_BOARD_FF_1_0 / _1_1 flag, the v1.2 figures are used - the most recent board, so
    ; a new one needs nothing here. Question 1 in HARDWARE-QUESTIONS.md asks which board it is.
    ;-D CONTROL_MPPT_BOARD_FF_1_0
    ;-D CONTROL_MPPT_BOARD_FF_1_1
    ;-D CONTROL_MPPT_VMPP_MIN=12.86   ; give BOTH of these or NEITHER - control_mppt.h #errors
    ;-D CONTROL_MPPT_VMPP_MAX=25.15
    ; --- battery, for the low-voltage interlocks ---
    ; A reading below this is treated as a broken sensor rather than a flat battery, so it can
    ; never trigger the low-voltage sleep. 9V is under any usable 12V battery and over any
    ; plausible garbage; the library's 2500 default is sized for a single lithium cell.
    -D SYSTEM_POWER_BAD_READING_MV=9000
    ; Low-voltage deep sleep - OSPIT's low_voltage_sleep_enabled. DELIBERATELY NOT ENABLED YET:
    ; under 11.9V the node would deep sleep five minutes at a time, but we do not know what the
    ; load switch (pin 14) and the DAC (pin 25) do while the ESP32 sleeps, so it could make things
    ; worse. See OSPIT_COMPARISON.md, docs/sleep-test.md and question 10 in HARDWARE-QUESTIONS.md.
    ;-D SYSTEM_POWER_LOW_MV=11900
    ;-D SYSTEM_POWER_LOW_MS=300000
    -D SENSOR_BATTERY_PIN=33
    ; OSPIT's 1k/15k divider, a factor of 16. It uses only about a quarter of the ADC's range;
    ; 3k3/15k (factor 5.546) is better on new hardware - see OSPIT_COMPARISON.md.
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=16
    ; --- display ---
    ; This board has no OLED in its board definition, so the chip, the bus and the panel size all
    ; have to be stated explicitly - actuator/oled.h #errors rather than guessing any of them.
    -D ACTUATOR_OLED_WANT
    -D ACTUATOR_OLED_IS_SSD1306
    '-D OLED_WIRE=Wire'
    -D OLED_SDA=21
    -D OLED_SCL=22
    -D OLED_RST_X=-1
    -D ACTUATOR_OLED_WIDTH=128
    -D ACTUATOR_OLED_HEIGHT=64
lib_deps =
    ${common.lib_deps_oled}

; ==== Lolin S2 Mini =================================================
; The same application with no charge-controller hardware. Pin choices follow
; https://github.com/mitra42/frugal-iot/wiki/Pin-usage-on-various-dev-boards#lolin-s2-mini :
; every ADC1 pin (GPIO1-10) is left free for analog, and the digital traffic is put on ADC2 pins
; (GPIO11-20), which are unusable for analog anyway once WiFi is up.
[env:s2_mini]
platform = ${common.platform_esp32}
board = lolin_s2_mini ; defines ARDUINO_LOLIN_S2_MINI
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="s2_mini"'
    ; --- irrigation hardware ---
    -D IRRIGATION_VALVE1_PIN=10
    -D IRRIGATION_VALVE2_PIN=13
    -D IRRIGATION_VALVE3_PIN=14
    ; Unlike the FF board this one has pins to spare, so it carries both roles separately - which
    ; also means this env is the one that compiles both paths.
    -D IRRIGATION_PUMP_PIN=38  ; digital-only pin; examples/agri already drives 38 as an output
    -D IRRIGATION_LOAD_PIN=40  ; digital-only, from the wiki's 37-44 set (37 and 39 are UART0)
    -D SENSOR_TANK_PIN=6   ; ADC1_CH5
    ; --- RS485 soil probes - slave ids from 2, see the note in the FF env ---
    -D SENSOR_SOILMODBUS_WANT
    -D SENSOR_SOILMODBUS_AUTOPROVISION
    -D SYSTEM_RS485_RX_PIN=16
    -D SYSTEM_RS485_TX_PIN=18
    '-D SYSTEM_RS485_UART=Serial1' ; The S2 has Serial0 and Serial1 only - there is no Serial2
    -D SENSOR_BATTERY_PIN=8 ; ADC1_CH7 comment out if testing on board with no resistor divider fitted or will auto-deep-sleep
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=6.641 ; 220k/39k
    -D SYSTEM_POWER_BAD_READING_MV=9000
 
; ==== Frugal-IoT Irrigation V0.2 board ==================================================
; hardware/irrigation-layout-oct-2026: ESP32-C6-MINI-1U, eight MOSFET valve outputs on a TCA9534, RS485,
; 12 V input with a 5 V buck, LiPo charger. Uses its own board variant, variants/frugal_irrigation_v02/.
; Pin map: that folder's DECISIONS.md D18 (C6 module fitted, the BOM default). C3-MINI-1U differences at the end.
; Replaces the V0.1 (relay) env: that board was never built.
;
; The valves are driven through a TCA9534 I2C expander (address 0x20, P0-P7 = valve terminals J11-J18,
; HIGH = valve on), not GPIOs - so they are Actuator_Digital_Expander rather than Actuator_Digital.
; The TCA9534 is on the always-on 3V rail, not 3V3_SW, so its outputs hold through a deep sleep even
; though the I2C pull-ups go off with RAIL_EN.
[env:frugal_irrigation_v02]
platform = ${common.platform_esp32}
board = esp32-c6-devkitc-1                ; generic C6; this board's own pins come from the variant
board_upload.flash_size = 4MB             ; -H4 module is 4 MB (the DevKitC-1 json says 8 MB)
board_upload.maximum_size = 4194304
board_build.variants_dir = variants
board_build.variant = frugal_irrigation_v02   ; LED_BUILTIN=8 plain LED, SDA=7, SCL=14
board_build.partitions = min_spiffs.csv
lib_deps =
    ${common.lib_deps_oled}
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="frugal_irrigation_v02"'
    -D ARDUINO_FRUGAL_IOT_IRRIGATION_V02      ; this board, for code and for scripts/generate_platform_h.py
    -D ARDUINO_USB_MODE=1                     ; native USB on the USB-C: no USB-UART chip
    -D ARDUINO_USB_CDC_ON_BOOT=1              ; Serial = USB
    -D ACTUATOR_LEDBUILTIN_INVERT             ; status LED D8 on GPIO8 is active LOW
    ; --- I2C (sensor terminal J8, OLED header J9, TCA9534) ---
    -D I2C_SDA=7
    -D I2C_SCL=14
    ; --- switched rails: RAIL_EN (GPIO15) HIGH = 3V3_SW and 5V_SW on; 100k pull-down = off at reset.
    ; Must be on before ANY I2C traffic - the bus pull-ups are on 3V3_SW - and before RS485.
    -D SYSTEM_POWER3v3_PIN=15
    ; --- RS485 (J10: 5V_SW, A, B, GND). Direction is switched in hardware from TX, so no DE/RE pin.
    -D SENSOR_SOILMODBUS_WANT
    -D SENSOR_SOILMODBUS_AUTOPROVISION
    -D SYSTEM_RS485_RX_PIN=0
    -D SYSTEM_RS485_TX_PIN=2
    '-D SYSTEM_RS485_UART=Serial1'            ; Serial is USB, Serial0 is the debug UART
    ; --- battery for the LVD interlocks: the 12 V input, V12_SENSE on GPIO1, 560k/100k = x6.6 ---
    -D SENSOR_BATTERY_PIN=1
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=6.6
    -D SYSTEM_POWER_BAD_READING_MV=9000
    ; The LiPo (if fitted) is read on GPIO3, 1M/1M = x2 - the library has one battery input, so
    ; this one is unused until there is a second (e.g. SENSOR_CELL_PIN=3, divider 2).
    ; --- valves, on the TCA9534 (see top). _BIT is the expander pin, P0-P7 ---
    -D IRRIGATION_RELAY_TCA9534_ADDRESS=0x20
    -D IRRIGATION_VALVE1_BIT=0               ; J11
    -D IRRIGATION_VALVE2_BIT=1               ; J12
    -D IRRIGATION_VALVE3_BIT=2               ; J13
    -D IRRIGATION_PUMP_BIT=3                 ; J14
    ; More sectors: each line adds a valve, a soil probe (Modbus slave id 5, 6...) and a sector
    ;-D IRRIGATION_VALVE4_BIT=4              ; J15
    ;-D IRRIGATION_VALVE5_BIT=5              ; J16
    ;-D IRRIGATION_VALVE6_BIT=6              ; J17
    ;-D IRRIGATION_VALVE7_BIT=7              ; J18
    ; --- spare inputs ---
    ;-D SENSOR_TANK_PIN=6                    ; GPIO_A terminal J6 (ADC1_CH6) - e.g. the tank gauge
    ;                                        ; GPIO_B terminal J7 = GPIO22 (digital), BTN2 = GPIO19
    ; --- OLED on header J9 (SSD1306 128x64, powered from 3V3_SW) ---
    -D ACTUATOR_OLED_WANT
    -D ACTUATOR_OLED_IS_SSD1306
    '-D OLED_WIRE=Wire'
    -D OLED_SDA=7
    -D OLED_SCL=14
    -D OLED_RST_X=-1
    -D ACTUATOR_OLED_WIDTH=128
    -D ACTUATOR_OLED_HEIGHT=64
;
; With the ESP32-C3-MINI-1U fitted instead (and R5/R6 fitted, R3/R4 removed - D19):
;   board = esp32-c3-devkitm-1 (4 MB; drop the two board_upload lines), and in the variant and flags:
;   I2C_SDA / OLED_SDA = 10, I2C_SCL / OLED_SCL = 5, SYSTEM_POWER3v3_PIN = 6, UART0 TX/RX = 21/20.
;   No BTN2, GPIO_A or GPIO_B (C6-only pads). The library already inverts the LED for esp32-c3-devkitm-1.

; ==== Lolin S2 Mini + irrigation daughter board ==========================================
; hardware/irrigation-daughter: the valve drivers on their own, driven over I2C. Wiring in README.md.
; The daughter's 3V3 comes from the S2's 3V3 pin (always on - the S2 has no switched rail), and its V12
; (the battery through its 560k/100k divider) goes to GPIO3: on the outer header row, next to 3V3, where
; the wire does not pass another pin. RS485 needs an external 3.3 V transceiver module (below). The S2 Mini
; is powered from 5 V USB (e.g. an MPPT controller's USB socket).
[env:s2_mini_daughter]
platform = ${common.platform_esp32}
board = lolin_s2_mini ; defines ARDUINO_LOLIN_S2_MINI
board_build.partitions = min_spiffs.csv
lib_deps =
    ${common.lib_deps_oled}
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="s2_mini_daughter"'
    ; --- I2C to the daughter board's J1 (SDA, SCL) and on to its OLED header. GPIO16/18, not the S2 Mini's
    ; usual 33/35, so that on its right-hand header the RS485 pair (to the transceiver) sits above the I2C
    ; pair (to J1) and the wiring needs no crossings - see docs/wiring_s2_daughter.png. The S2 Mini has no
    ; I2C pull-ups; the daughter board's R19/R20 (4.7k, fitted) are the bus's.
    -D I2C_SDA=16
    -D I2C_SCL=18
    ; --- valves, on the daughter's TCA9534 at 0x20; _BIT is the expander pin P0-P7 = terminals J4-J11
    -D IRRIGATION_RELAY_TCA9534_ADDRESS=0x20
    -D IRRIGATION_VALVE1_BIT=0               ; daughter J4
    -D IRRIGATION_VALVE2_BIT=1               ; daughter J5
    -D IRRIGATION_VALVE3_BIT=2               ; daughter J6
    -D IRRIGATION_PUMP_BIT=3                 ; daughter J7
    ; More sectors: each line adds a valve, a soil probe (Modbus slave id 5, 6...) and a sector
    ;-D IRRIGATION_VALVE4_BIT=4              ; daughter J8
    ;-D IRRIGATION_VALVE5_BIT=5              ; daughter J9
    ;-D IRRIGATION_VALVE6_BIT=6              ; daughter J10
    ;-D IRRIGATION_VALVE7_BIT=7              ; daughter J11
    -D IRRIGATION_LOAD_PIN=40                ; digital-only, as the plain s2_mini env
    -D SENSOR_TANK_PIN=6                     ; ADC1_CH5
    ; --- RS485 soil probes, through an external transceiver module - slave ids from 2, see the FF env.
    ; The module must switch direction itself (there is no DE pin here) and run at 3.3 V: one powered from
    ; 5 V puts 5 V on RO, which the S2 cannot take. Its DI from TX (GPIO35), RO to RX (GPIO33).
    -D SENSOR_SOILMODBUS_WANT
    -D SENSOR_SOILMODBUS_AUTOPROVISION
    -D SYSTEM_RS485_RX_PIN=33
    -D SYSTEM_RS485_TX_PIN=35
    '-D SYSTEM_RS485_UART=Serial1'           ; The S2 has Serial0 and Serial1 only
    ; --- battery: the daughter's V12 (J1, rightmost) on GPIO3, ADC1_CH2; its 560k/100k divider = x6.6
    -D SENSOR_BATTERY_PIN=3
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=6.6
    -D SYSTEM_POWER_BAD_READING_MV=9000
    ; --- OLED on the daughter's J3 (SSD1306 128x64), on the same I2C bus ---
    -D ACTUATOR_OLED_WANT
    -D ACTUATOR_OLED_IS_SSD1306
    '-D OLED_WIRE=Wire'
    -D OLED_SDA=16
    -D OLED_SCL=18
    -D OLED_RST_X=-1
    -D ACTUATOR_OLED_WIDTH=128
    -D ACTUATOR_OLED_HEIGHT=64

; ==== Frugal-IoT sensor board V0.2 + irrigation daughter board ==========================
; frugal-iot-hw-sensor V0.2 (ESP32-C3-WROOM-02U, charger, RS485) as the host; hardware/irrigation-daughter
; for the valves. Wiring in README.md: a 5-wire cable from the daughter's J1 to the sensor board's J2 -
; pins 1-4 straight across (GND, SDA, SCL, 3V3_SW) and daughter J1.5 (V12) to sensor J2.9 (SENS2, GPIO1).
; Pins from the sensor board's own env (its firmware/platformio-env.ini); its variant is copied into
; variants/frugal_iot_v02/. The sensor board is powered from its USB-C (e.g. an MPPT controller's USB
; port), the valves from the 12 V battery into the daughter's J2.
[env:sensor_v02_daughter]
platform = ${common.platform_esp32}
board = esp32-c3-devkitm-1                ; generic C3, 4 MB = the -N4 module; defines ARDUINO_ESP32C3_DEV
board_build.variants_dir = variants
board_build.variant = frugal_iot_v02      ; LED_BUILTIN=8 plain LED, SDA=6, SCL=7
board_build.partitions = min_spiffs.csv
lib_deps =
    ${common.lib_deps_oled}
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="sensor_v02_daughter"'
    -D ARDUINO_FRUGAL_IOT_V02                 ; the sensor board, for code and for scripts/generate_platform_h.py
    -D ARDUINO_USB_MODE=1                     ; native USB on the USB-C: no USB-UART chip
    -D ARDUINO_USB_CDC_ON_BOOT=1              ; Serial = USB
    ; Status LED on GPIO8 is active LOW; the library already inverts it for ARDUINO_ESP32C3_DEV.
    ; --- I2C on the sensor board's J2 pins 2/3, on to the daughter board and its OLED ---
    -D I2C_SDA=6
    -D I2C_SCL=7
    ; --- switched sensor rail: nRAIL_EN (GPIO5) LOW = 3V3_SW on. It powers the I2C pull-ups, RS485 and
    ; the daughter board's TCA9534: rail off = every valve off (daughter DECISIONS D3).
    -D SYSTEM_POWER0_PIN=5
    ; --- valves, on the daughter's TCA9534 at 0x20; _BIT is the expander pin P0-P7 = terminals J4-J11
    -D IRRIGATION_RELAY_TCA9534_ADDRESS=0x20
    -D IRRIGATION_VALVE1_BIT=0               ; daughter J4
    -D IRRIGATION_VALVE2_BIT=1               ; daughter J5
    -D IRRIGATION_VALVE3_BIT=2               ; daughter J6
    -D IRRIGATION_PUMP_BIT=3                 ; daughter J7
    ; More sectors: each line adds a valve, a soil probe (Modbus slave id 5, 6...) and a sector
    ;-D IRRIGATION_VALVE4_BIT=4              ; daughter J8
    ;-D IRRIGATION_VALVE5_BIT=5              ; daughter J9
    ;-D IRRIGATION_VALVE6_BIT=6              ; daughter J10
    ;-D IRRIGATION_VALVE7_BIT=7              ; daughter J11
    ; --- RS485 soil probes on the sensor board's J3 pins 2 (A) / 3 (B). The probes need their own
    ; 5-30 V supply: J3 has only 3V3_SW (daughter DECISIONS D1) ---
    -D SENSOR_SOILMODBUS_WANT
    -D SENSOR_SOILMODBUS_AUTOPROVISION
    -D SYSTEM_RS485_RX_PIN=20
    -D SYSTEM_RS485_TX_PIN=21
    -D SYSTEM_RS485_DE_PIN=10                ; HIGH = transmit; RE is tied to DE
    '-D SYSTEM_RS485_UART=Serial1'
    ; --- battery for the LVD interlocks: the 12 V battery, from the daughter's V12 on SENS2 (GPIO1,
    ; J2 pin 9), 560k/100k = x6.6. The sensor board's own LiPo (GPIO3, x2) is then not measured: the
    ; library has one battery input.
    -D SENSOR_BATTERY_PIN=1
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=6.6
    -D SYSTEM_POWER_BAD_READING_MV=9000
    ; --- tank gauge, if fitted: SENS1 (GPIO0, J2 pin 6; its 4.7k pull-up R18 is fitted - remove it for
    ; a resistive sender, see sensor_tank.h) ---
    ;-D SENSOR_TANK_PIN=0
    ; --- OLED on the daughter's J3 (SSD1306 128x64), on the same I2C bus ---
    -D ACTUATOR_OLED_WANT
    -D ACTUATOR_OLED_IS_SSD1306
    '-D OLED_WIRE=Wire'
    -D OLED_SDA=6
    -D OLED_SCL=7
    -D OLED_RST_X=-1
    -D ACTUATOR_OLED_WIDTH=128
    -D ACTUATOR_OLED_HEIGHT=64
