; PlatformIO Project Configuration File - Frugal-IoT OSPIT irrigation node
;
; Two boards, deliberately, for the same application:
;
;   ff_openmppt  the FF-ESP32-OpenMPPT solar charge controller OSPIT itself runs on. This is the
;                target board; MPPT is NOT implemented here (that is P4/P5) - the charge control
;                hardware is simply left alone and this build uses the board only for irrigation.
;   s2_mini      a Lolin S2 Mini, i.e. the same application on a plain dev board with no MPPT
;                hardware at all. More pins, less to go wrong, and it proves nothing in the
;                application depends on the charge controller.
;
; They target different ARDUINO_* macros (ARDUINO_ESP32_DEV and ARDUINO_LOLIN_S2_MINI), so
; scripts/generate_platform_h.py emits both into platform.h rather than marking one DISABLED -
; unlike two envs for the same board, where it keeps only the first.

[platformio]
; An OPTIONAL, gitignored file for local overrides - see "Building against a local library" in
; CLAUDE.md. PlatformIO ignores the line if the file does not exist, so a fresh clone needs nothing.
extra_configs = platformio-local.ini
name: Frugal-IoT Irrigation
description: Solar-powered sequenced soil-moisture irrigation - a port of OSPIT onto Frugal-IoT
src_dir = .
; src_dir = . keeps the sketch at the top of the repo, which is what lets the SAME directory build
; in the Arduino IDE: it needs a .ino whose name matches the folder, beside its own .cpp/.h files.
; Arduino ignores every subdirectory except src/, so lib/, data/, scripts/ and .pio/ are invisible
; to it.

[common]
; Until ospit-p1 is merged into the library's main branch, build against that branch directly.
; A developer working on the library at the same time drops a symlink at lib/Frugal-IoT (it is
; gitignored) - PlatformIO searches the project's own lib/ before lib_deps, so the symlink wins
; and edits to the library are picked up with no reinstall.
; Arduino IDE users install Frugal-IoT from the Library Manager instead.
lib_deps =
    https://github.com/mitra42/frugal-iot.git#ospit-p1
    ; ModbusMaster (the RS485 soil probes) is a declared dependency of Frugal-IoT, so
    ; lib_ldf_mode = chain pulls it in - it does not need listing here.

lib_deps_oled =
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13

; These are flags common to pretty much all frugal-iot projects
; comment or uncomment debug flags based on need
build_flags_frugaliot =
    ;-D CONTROL_IRRIGATION_DEBUG
    ;-D SENSOR_SOILMODBUS_DEBUG
    ;-D SYSTEM_MODBUS_DEBUG
    ;-D SENSOR_ANALOG_DEBUG
    ; On for the sleep-test branch: it is what prints `Sleeping` just before the board goes, which
    ; is the only indication a tester with a serial monitor gets.
    -D SYSTEM_POWER_DEBUG
    ;-D SYSTEM_TIME_DEBUG
    ;-D SYSTEM_MQTT_DEBUG
    ;-D SYSTEM_WIFI_DEBUG
    ; Turn off C++ exceptions - nothing in this example throws. See examples/agri/platformio.ini
    ; for the measurements behind this.
    -fno-exceptions

; flags that apply only in main (the library can see them, but doesnt need them)
build_flags_main =

; project specific flags that are needed by the library
build_flags_library =
    '-D SYSTEM_OTA_PREFIX="ospit"'

; Battery interlock thresholds, in millivolts. Each is a LIMIT with a DEAD BAND: 12100 +/- 200
; means "off below 11.9V, on again above 12.3V". Here rather than in the sketch because they are
; the main thing that differs between installations - battery chemistry, panel size, and how much
; you mind losing each thing. Together they set the ORDER things are given up in as the battery
; falls: USB first, then irrigation, and the router last. See the note in the .ino.
; Setting OSPIT_LVD_IRRIGATION_MV to 12100 restores OSPIT's behaviour of gating irrigation on the
; same threshold as the load.
build_flags_lvd =
    -D OSPIT_LVD_LOAD_MV=12100
    -D OSPIT_LVD_LOAD_HYST_MV=200
    -D OSPIT_LVD_USB_MV=13100
    -D OSPIT_LVD_USB_HYST_MV=300
    -D OSPIT_LVD_IRRIGATION_MV=12600
    -D OSPIT_LVD_IRRIGATION_HYST_MV=200

; THE SLEEP-TEST BRANCH ONLY - do not merge this section to main.
; Deep sleep on a repeating cycle, so the outputs can be measured while the board is asleep. The
; sleep is the remainder: 420000 - 300000 = five minutes awake, then two minutes asleep. Lengthen
; the wake if reconnecting to WiFi leaves too little time to work with the page, or the cycle if
; two minutes is not long enough to get the meter on to both terminals.
; docs/sleep-test.md on main is the procedure; question 10 in HARDWARE-QUESTIONS.md is the why.
build_flags_sleeptest =
    -D OSPIT_SLEEP_TEST
    -D OSPIT_SLEEP_TEST_CYCLE_MS=420000
    -D OSPIT_SLEEP_TEST_WAKE_MS=300000

; Ask the linker for a map file - scripts/size_report.py reads it.
build_flags_map =
    -Wl,-Map=$BUILD_DIR/firmware.map

build_flags =
    ${common.build_flags_frugaliot}
    ${common.build_flags_main}
    ${common.build_flags_library}
    ${common.build_flags_lvd}
    ${common.build_flags_sleeptest}
    ${common.build_flags_map}

platform_esp32 = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

[env]
; src_dir = . means "the project's sources are at the top of the repo", which is what makes the
; same directory open in the Arduino IDE. But it also means PlatformIO would compile EVERY .cpp
; below here as project source - including, through the lib/Frugal-IoT symlink, the library's own
; examples and their downloaded dependencies. So say explicitly what is ours.
; Arduino IDE needs no equivalent: it ignores every subdirectory except src/.
build_src_filter = +<*> -<lib/> -<data/> -<scripts/> -<.pio/> -<docs/>
monitor_speed = 460800 ; If not 460800 then also change in main.cpp: frugal_iot.startSerial(newspeed, 5000);
upload_speed = 460800
framework = arduino
board_build.filesystem = littlefs ; Use LittleFS instead of SPIFFS
lib_compat_mode = strict
lib_deps = ${common.lib_deps}
lib_ldf_mode = chain

; ==== FF-ESP32-OpenMPPT =============================================
; The solar charge controller board OSPIT runs on - a plain ESP32. Pin assignments below are
; OSPIT's own, read out of its Lua:
;   valves 26, 27, 12          irrigation.lua `local valves = {26, 27, 12, 14}`
;   pump / load 14             irrigation.lua drives it with the valve when pump_is_load is false;
;                              mp2.lua also uses it as the low-voltage load disconnect, and
;                              control.lua exposes it as "Load power output". Three jobs, one pin.
;   RS485 rx 16 / tx 17        modbr.lua, uart.setup(2, ..., {tx = 17, rx = 16})
;   tank gauge GPIO32          irrigation.lua ADCmeasure(4, 2), i.e. ADC1 channel 4
;   battery GPIO33             mp2.lua Voutmeasure(), ADC1 channel 5, 1k/15k divider = ratio 16
;   OLED I2C 21/22             init.lua loads SSD1306.lua
;
; NOTE the display here is the I2C SSD1306, NOT the SSD1327 SPI panel that examples/all builds for
; this board. The SSD1327 needs dc=16 and rst=17, which are the very UEXT pins the RS485 probes
; use - you get the display or the probes, not both. OSPIT makes the same choice: init.lua loads
; SSD1306.lua and leaves the SSD1327 line commented out.
[env:ff_openmppt]
platform = ${common.platform_esp32}
board = esp32dev ; defines ARDUINO_ESP32_DEV
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="ff_openmppt"'
    ; --- irrigation hardware ---
    -D OSPIT_VALVE1_PIN=26
    -D OSPIT_VALVE2_PIN=27
    -D OSPIT_VALVE3_PIN=12
    ; Pin 14 can be a pump OR a load switch, not both - see the note in ospit.ino. OSPIT's own
    ; default (pump_is_load=true) is the load role; the pump role is chosen here because P2 has no
    ; MPPT to own a load output and because it exercises the pump path. To swap, comment out
    ; OSPIT_PUMP_PIN and uncomment OSPIT_LOAD_PIN.
    -D OSPIT_PUMP_PIN=14
    ;-D OSPIT_LOAD_PIN=14
    ; A USB supply on pin 12 - the SAME PIN as valve 3. OSPIT decides which it is by whether a
    ; probe answers on sector 3; here, define one or the other. If you enable this, remove
    ; OSPIT_VALVE3_PIN above and drop sector 3 from the sketch.
    ;-D OSPIT_USB_PIN=12
    ; The tank gauge. mp2.lua's header comment calls GPIO32 a temperature sense input, but
    ; irrigation.lua reads it as the tank - question 7 in HARDWARE-QUESTIONS.md settles it. If it
    ; turns out to be the temperature input, comment this out and no tank code is compiled.
    -D OSPIT_TANK_PIN=32
    ; --- RS485 soil probes. Slave ids are set in the .ino and start at 2: address 1 is the
    ; factory default and has to stay meaning "not yet provisioned" - see sensor/soilmodbus.h
    -D SENSOR_SOILMODBUS_WANT
    -D SENSOR_SOILMODBUS_AUTOPROVISION
    -D SYSTEM_RS485_RX_PIN=16
    -D SYSTEM_RS485_TX_PIN=17
    '-D OSPIT_RS485_UART=Serial2'
    ; --- charge controller instrumentation (P5.1 - measurement only, nothing is driven) ---
    ; Solar panel voltage. 1k/27k divider is the 0.035714 ratio in mp2.lua's Vinmeasure(), so 28.
    -D OSPIT_PANEL_PIN=34
    -D OSPIT_PANEL_DIVIDER=28
    ; The series Schottky D6 drops about 300mV, so the panel is that much higher than the pin says.
    ; SET THIS TO 0 if D6 has been replaced by a wire on your board - question 2 in
    ; HARDWARE-QUESTIONS.md tells the tester how to look.
    -D OSPIT_PANEL_DIODE_MV=300
    ; Up to three DS18B20 probes share this pin - air, battery and board temperature. They are told
    ; apart by the id burned into each probe, so which is which survives unplugging them.
    -D OSPIT_ONEWIRE_PIN=2
    ; The OTHER way this board can measure its own heat: two diodes read as an analog voltage.
    ; LEFT OFF DELIBERATELY - we believe the DS18B20 above does this job, and turning both on would
    ; give two different answers to the same question. Question 4 in HARDWARE-QUESTIONS.md asks
    ; the tester to look for the diodes; uncomment if they are there and the DS18B20 is not.
    ;-D OSPIT_HEATSINK_PIN=35
    ; --- solar charge control (P5.2 - set by hand, nothing tracks yet) ---
    ; DAC channel 1. Channel 2 is GPIO26, which this board uses as valve 1, so there is only one.
    -D OSPIT_MPPT_DAC_PIN=25
    ; Which panel-voltage range the charge circuit can ask for. With neither of these set nor a
    ; CONTROL_MPPT_BOARD_FF_1_0 / _1_1 flag, the v1.2 figures are used - the most recent board, so
    ; a new one needs nothing here. Question 1 in HARDWARE-QUESTIONS.md asks which board it is.
    ;-D CONTROL_MPPT_BOARD_FF_1_0
    ;-D CONTROL_MPPT_BOARD_FF_1_1
    ;-D CONTROL_MPPT_VMPP_MIN=12.86   ; give BOTH of these or NEITHER - control_mppt.h #errors
    ;-D CONTROL_MPPT_VMPP_MAX=25.15
    ; --- battery, for the low-voltage interlocks ---
    ; A reading below this is treated as a broken sensor rather than a flat battery, so it can
    ; never trigger the low-voltage sleep. 9V is under any usable 12V battery and over any
    ; plausible garbage; the library's 2500 default is sized for a single lithium cell.
    -D SYSTEM_POWER_BAD_READING_MV=9000
    ; Low-voltage deep sleep - OSPIT's low_voltage_sleep_enabled. DELIBERATELY NOT ENABLED YET.
    ; Uncommenting the two lines below reproduces OSPIT exactly: under 11.9V the node deep sleeps
    ; for five minutes at a time so the panel can put something back. The mechanism is in the
    ; library and works.
    ; It is off because we do not know what this board's outputs do while the ESP32 is asleep, and
    ; that decides whether it helps or hurts. A GPIO is released in deep sleep unless explicitly
    ; held, and is.lua configures pin 14 - the load switch - with PULL_UP. If that pull-up turns
    ; the router back ON while we sleep to save power, sleeping makes things worse. The same
    ; question applies to the DAC on pin 25: if charging stops while asleep, the battery cannot
    ; recover during the very sleep meant to let it.
    ; In proportion: the ESP32 draws well under a watt, so on an 18Ah battery it is not what
    ; flattens it - the load is, and the load interlock already sheds that at 11.9V. This is an
    ; optimisation, not something to enable on a guess. docs/sleep-test.md is the measurement that
    ; settles it, on the sleep-test branch; question 10 in HARDWARE-QUESTIONS.md points there.
    ;-D SYSTEM_POWER_LOW_MV=11900
    ;-D SYSTEM_POWER_LOW_MS=300000
    -D SENSOR_BATTERY_PIN=33
    ; OSPIT's own divider: 1k/15k, the 0.0625 ratio in mp2.lua's Voutmeasure(), so a factor of 16.
    ; At 12.6V that puts only 0.79V on the pin, using about a quarter of the ADC's range. Changing
    ; the divider to 3k3/15k - ratio 0.1803, so a factor of 5.546 - gives noticeably better
    ; resolution if you are building the hardware rather than working with an existing board.
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=16
    ; --- display ---
    ; This board has no OLED in its board definition, so the chip, the bus and the panel size all
    ; have to be stated explicitly - actuator/oled.h #errors rather than guessing any of them.
    -D ACTUATOR_OLED_WANT
    -D ACTUATOR_OLED_IS_SSD1306
    '-D OLED_WIRE=Wire'
    -D OLED_SDA=21
    -D OLED_SCL=22
    -D OLED_RST_X=-1
    -D ACTUATOR_OLED_WIDTH=128
    -D ACTUATOR_OLED_HEIGHT=64
lib_deps =
    ${common.lib_deps_oled}

; ==== Lolin S2 Mini =================================================
; The same application with no charge-controller hardware. Pin choices follow
; https://github.com/mitra42/frugal-iot/wiki/Pin-usage-on-various-dev-boards#lolin-s2-mini :
; every ADC1 pin (GPIO1-10) is left free for analog, and the digital traffic is put on ADC2 pins
; (GPIO11-20), which are unusable for analog anyway once WiFi is up.
[env:s2_mini]
platform = ${common.platform_esp32}
board = lolin_s2_mini ; defines ARDUINO_LOLIN_S2_MINI
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    '-D SYSTEM_OTA_SUFFIX="s2_mini"'
    ; --- irrigation hardware ---
    -D OSPIT_VALVE1_PIN=10
    -D OSPIT_VALVE2_PIN=13
    -D OSPIT_VALVE3_PIN=14
    ; Unlike the FF board this one has pins to spare, so it carries both roles separately - which
    ; also means this env is the one that compiles both paths.
    -D OSPIT_PUMP_PIN=38  ; digital-only pin; examples/agri already drives 38 as an output
    -D OSPIT_LOAD_PIN=40  ; digital-only, from the wiki's 37-44 set (37 and 39 are UART0)
    -D OSPIT_TANK_PIN=6   ; ADC1_CH5
    ; --- RS485 soil probes - slave ids from 2, see the note in the FF env ---
    -D SENSOR_SOILMODBUS_WANT
    -D SENSOR_SOILMODBUS_AUTOPROVISION
    -D SYSTEM_RS485_RX_PIN=16
    -D SYSTEM_RS485_TX_PIN=18
    '-D OSPIT_RS485_UART=Serial1' ; The S2 has Serial0 and Serial1 only - there is no Serial2
    ; --- battery ---
    -D SENSOR_BATTERY_PIN=8 ; ADC1_CH7. Note examples/agri uses 16 on this board, which is ADC2
                            ; and so subject to the "ADC2 is shared with WiFi" caveat.
    -D SENSOR_BATTERY_VOLTAGE_DIVIDER=16 ; Assumes you fit the same 1k/15k divider as the FF board
